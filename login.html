<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8ec1e6">
  <meta name="author" content="Irakli Kvirkvelia · Homes in Georgia">
  <!-- Made with Claude (Anthropic) · © Homes in Georgia · Created by Irakli Kvirkvelia -->
  <title>შესვლა · ღიმილი CRM</title>
  <link rel="icon" href="./assets/logo.png">
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17324b;background:#8ec1e6}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.72),transparent 27%),linear-gradient(160deg,#8ec1e6,#dff3ff 68%,#fff)}main{width:min(100%,430px);background:rgba(255,255,255,.93);border:1px solid rgba(255,255,255,.9);border-radius:32px;padding:30px 22px;box-shadow:0 28px 70px rgba(19,85,135,.2);backdrop-filter:blur(18px)}img{display:block;width:min(80%,270px);height:auto;margin:0 auto 20px}h1{font-size:28px;letter-spacing:-.03em;margin:0 0 7px;text-align:center}p{margin:0 0 24px;text-align:center;color:#6a7f91;line-height:1.45}.field{margin-top:13px}label{display:block;margin:0 0 7px 3px;font-size:14px;font-weight:800;color:#49677d}input{width:100%;height:56px;border:1px solid #d6e4ed;border-radius:17px;background:#fff;padding:0 15px;font:inherit;font-size:16px;outline:none}input:focus{border-color:#176fe5;box-shadow:0 0 0 4px rgba(23,111,229,.12)}button,.chatgpt{width:100%;min-height:54px;border:0;border-radius:17px;font:inherit;font-weight:850;display:flex;align-items:center;justify-content:center;text-decoration:none}button{margin-top:18px;color:#fff;background:linear-gradient(135deg,#176fe5,#163fc4);box-shadow:0 10px 24px rgba(23,111,229,.24)}button:disabled{opacity:.6}.error{min-height:20px;margin:12px 2px 0;color:#b8322a;font-size:14px;font-weight:700;text-align:center}.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#91a4b1;font-size:12px}.divider:before,.divider:after{content:"";height:1px;background:#e1eaf0;flex:1}.chatgpt{background:#f0f6fa;color:#315a76}.note{font-size:12px;margin:16px 8px 0}
    .telegram-box{margin-top:18px;text-align:center}.telegram-box[hidden]{display:none}.divider{display:flex;align-items:center;gap:10px;color:#6a7f91;font-size:14px;margin-bottom:14px}.divider:before,.divider:after{content:"";flex:1;height:1px;background:#d9e5ee}#telegramWidget{min-height:44px;display:flex;justify-content:center}
  </style>
</head>
<body>
  <main>
    <img src="./assets/logo.png" alt="ღიმილი">
    <h1>CRM-ში შესვლა</h1>
    <p>სამუშაო მონაცემები ხელმისაწვდომია მხოლოდ დიანასა და მფლობელისთვის.</p>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">პაროლი</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button id="submit" type="submit">შესვლა</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <div id="telegramBox" class="telegram-box" hidden>
      <div class="divider"><span>ან</span></div>
      <div id="telegramWidget"></div>
      <p class="note">Telegram-ით შესვლა მუშაობს მხოლოდ ნებადართული ანგარიშებისთვის.</p>
    </div>
    <p class="note">არ გაუზიაროთ პაროლი სხვებს. შესვლის შემდეგ სესია ამ მოწყობილობაზე შეინახება.</p>
  </main>
  <script src="./config.js?v=20261030"></script>
  <script>
    const form=document.getElementById('loginForm'),button=document.getElementById('submit'),error=document.getElementById('error');
    form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';button.disabled=true;button.textContent='მოწმდება…';try{if(!window.GIMILI_API_URL)throw new Error('CRM API ჯერ არ არის დაყენებული');const response=await fetch(window.GIMILI_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',email:form.email.value,password:form.password.value})});const body=await response.json().catch(()=>({}));if(!body.ok)throw new Error(body.error||'შესვლა ვერ მოხერხდა');localStorage.setItem('gimili_crm_session',body.token);localStorage.setItem('gimili_crm_user',JSON.stringify(body.user||{}));location.replace('./crm.html')}catch(reason){error.textContent=reason.message||'შესვლა ვერ მოხერხდა';button.disabled=false;button.textContent='შესვლა'}});
  </script>
  <script>
    // Telegram Login Widget: shown only when a bot is configured in config.js
    async function onTelegramAuth(telegramUser){
      error.textContent='';
      try{
        const response=await fetch(window.GIMILI_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'telegramLogin',telegram:telegramUser})});
        const body=await response.json().catch(()=>({}));
        if(!body.ok)throw new Error(body.error||'Telegram-ით შესვლა ვერ მოხერხდა');
        localStorage.setItem('gimili_crm_session',body.token);
        localStorage.setItem('gimili_crm_user',JSON.stringify(body.user||{}));
        location.replace('./crm.html');
      }catch(reason){error.textContent=reason.message||'Telegram-ით შესვლა ვერ მოხერხდა'}
    }
    if(window.GIMILI_TELEGRAM_BOT){
      const widget=document.createElement('script');
      widget.async=true;widget.src='https://telegram.org/js/telegram-widget.js?22';
      widget.setAttribute('data-telegram-login',String(window.GIMILI_TELEGRAM_BOT).replace(/^@/,''));
      widget.setAttribute('data-size','large');widget.setAttribute('data-radius','14');
      widget.setAttribute('data-onauth','onTelegramAuth(user)');widget.setAttribute('data-request-access','write');
      document.getElementById('telegramWidget').appendChild(widget);
      document.getElementById('telegramBox').hidden=false;
    }
  </script>
</body>
</html>
