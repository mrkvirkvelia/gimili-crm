<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8ec1e6">
  <meta name="author" content="Irakli Kvirkvelia · Homes in Georgia">
  <!-- Made with Claude (Anthropic) · © Homes in Georgia · Created by Irakli Kvirkvelia -->
  <title>შესვლა · ღიმილი CRM</title>
  <link rel="icon" href="./assets/icon.png">
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17324b;background:#8ec1e6}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.72),transparent 27%),linear-gradient(160deg,#8ec1e6,#dff3ff 68%,#fff)}main{width:min(100%,430px);background:rgba(255,255,255,.93);border:1px solid rgba(255,255,255,.9);border-radius:32px;padding:30px 22px;box-shadow:0 28px 70px rgba(19,85,135,.2);backdrop-filter:blur(18px)}img{display:block;width:min(80%,270px);height:auto;margin:0 auto 20px}h1{font-size:28px;letter-spacing:-.03em;margin:0 0 7px;text-align:center}p{margin:0 0 24px;text-align:center;color:#6a7f91;line-height:1.45}.field{margin-top:13px}label{display:block;margin:0 0 7px 3px;font-size:14px;font-weight:800;color:#49677d}input{width:100%;height:56px;border:1px solid #d6e4ed;border-radius:17px;background:#fff;padding:0 15px;font:inherit;font-size:16px;outline:none}input:focus{border-color:#176fe5;box-shadow:0 0 0 4px rgba(23,111,229,.12)}button,.chatgpt{width:100%;min-height:54px;border:0;border-radius:17px;font:inherit;font-weight:850;display:flex;align-items:center;justify-content:center;text-decoration:none}button{margin-top:18px;color:#fff;background:linear-gradient(135deg,#176fe5,#163fc4);box-shadow:0 10px 24px rgba(23,111,229,.24)}button:disabled{opacity:.6}.error{min-height:20px;margin:12px 2px 0;color:#b8322a;font-size:14px;font-weight:700;text-align:center}.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#91a4b1;font-size:12px}.divider:before,.divider:after{content:"";height:1px;background:#e1eaf0;flex:1}.chatgpt{background:#f0f6fa;color:#315a76}.note{font-size:12px;margin:16px 8px 0}
    label small{font-weight:600;color:#91a4b1}.pass{position:relative}.pass input{padding-right:58px}.eye{position:absolute;right:6px;top:6px;width:44px;min-height:44px;height:44px;margin:0;background:transparent;box-shadow:none;color:#49677d;font-size:18px}#emailField[hidden]{display:none}
  </style>
</head>
<body>
  <main>
    <img src="./assets/logo.webp" alt="ღიმილი">
    <h1>CRM-ში შესვლა</h1>
    <p>შეიყვანეთ პაროლი.</p>
    <form id="loginForm">
      <div class="field"><label for="password">პაროლი</label><div class="pass"><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button type="button" class="eye" id="eye" aria-label="პაროლის ჩვენება">👁</button></div></div>
      <button id="submit" type="submit">შესვლა</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <p class="note">არ გაუზიაროთ პაროლი სხვებს. შესვლის შემდეგ სესია ამ მოწყობილობაზე შეინახება.</p>
  </main>
  <script src="./config.js?v=20261030-5"></script>
  <script>
    const form=document.getElementById('loginForm'),button=document.getElementById('submit'),error=document.getElementById('error'),passwordInput=form.password;
    document.getElementById('eye').addEventListener('click',()=>{passwordInput.type=passwordInput.type==='password'?'text':'password';passwordInput.focus();});
    const deviceId=(()=>{try{let id=localStorage.getItem('gimili_device_id');if(!id){id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));localStorage.setItem('gimili_device_id',id);}return id;}catch(_){return '';}})();
    form.addEventListener('submit',async event=>{
      event.preventDefault();error.textContent='';button.disabled=true;button.textContent='მოწმდება…';
      try{
        if(!window.GIMILI_API_URL)throw new Error('CRM API ჯერ არ არის დაყენებული');
        const response=await fetch(window.GIMILI_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',password:passwordInput.value,deviceId})});
        const body=await response.json().catch(()=>({}));
        if(!body.ok)throw new Error(body.error==='Неверный пароль.'?'პაროლი არასწორია':body.error||'შესვლა ვერ მოხერხდა');
        localStorage.setItem('gimili_crm_session',body.token);localStorage.setItem('gimili_crm_user',JSON.stringify(body.user||{}));
        location.replace('./crm.html');
      }catch(reason){error.textContent=reason.message||'შესვლა ვერ მოხერხდა';button.disabled=false;button.textContent='შესვლა';passwordInput.select();}
    });
  </script>
</body>
</html>
