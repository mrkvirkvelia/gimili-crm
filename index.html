<style>
  /* Sky band with the logo's sun, white "toy-box" cards in the logo's colours. One clear next step on every screen. */
  :root{
    --sky:#8ec8ef; --paper:#f4faff; --navy:#1b3cae; --ink:#16305a; --muted:#5a7290; --line:#dbe9f5;
    --sun:#ffd21f; --sun-deep:#f5b400; --pink:#e8178a; --green:#22a83a; --blue:#1a8fe0; --red:#e5261f;
    --font:"Nunito","Noto Sans Georgian",system-ui,sans-serif; --r:26px; --head:60px;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:calc(var(--head) + 12px)}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;overflow-x:hidden}
  @supports(overflow:clip){body{overflow-x:clip}}
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{width:min(100%,1140px);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  h1,h2,h3{line-height:1.15;text-wrap:balance;margin:0}
  :focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:10px}
  svg{flex:none}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:999px;font:900 16px var(--font);text-decoration:none;cursor:pointer;border:0;transition:transform .15s,box-shadow .15s;white-space:nowrap}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:21px;height:21px}
  .b-sun{background:var(--sun);color:var(--navy);box-shadow:0 5px 0 var(--sun-deep)}
  .b-pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 #b80f6b}
  .b-white{background:#fff;color:var(--navy);box-shadow:0 5px 0 var(--line)}

  /* header */
  .top{position:sticky;top:0;z-index:40;background:rgba(142,200,239,.94);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top);transition:box-shadow .2s}
  .top.scrolled{box-shadow:0 6px 20px rgba(20,60,120,.14)}
  .top .wrap{display:flex;align-items:center;gap:10px;min-height:var(--head)}
  .brand img{height:42px;width:auto}
  .nav{display:flex;gap:2px;margin-left:auto}
  .nav a{text-decoration:none;font-weight:800;color:var(--navy);padding:8px 11px;border-radius:999px;font-size:15px;white-space:nowrap}
  .nav a:hover,.nav a.on{background:rgba(255,255,255,.7)}
  .tel-top{display:inline-flex;align-items:center;gap:6px;background:var(--pink);color:#fff;text-decoration:none;font:900 14px var(--font);padding:8px 13px;border-radius:999px;white-space:nowrap}
  .tel-top svg{width:15px;height:15px}
  .lang{display:flex;background:#fff;border-radius:999px;padding:3px;gap:2px}
  .lang button{border:0;background:transparent;font:800 13px var(--font);color:var(--navy);padding:0 10px;min-height:38px;min-width:40px;border-radius:999px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
  .burger{display:none;width:44px;height:44px;border:0;border-radius:14px;background:#fff;color:var(--navy);cursor:pointer;place-items:center}
  .burger svg{width:24px;height:24px}
  @media(max-width:1020px){.nav{display:none}.burger{display:grid;order:4}.top .lang{margin-left:auto;order:2}.tel-top{order:3}}
  @media(max-width:640px){.tel-top span{display:none}.tel-top{width:44px;height:44px;padding:0;justify-content:center;border-radius:14px}.tel-top svg{width:20px;height:20px}.top .lang button{padding:0 8px;min-width:38px}}
  @media(max-width:400px){.brand img{height:32px}.top .wrap{gap:7px}.top .lang button{padding:0 6px;min-width:34px;font-size:12px}}

  /* mobile menu */
  .drawer{position:fixed;inset:0;z-index:60;display:none}
  .drawer.open{display:block}
  .drawer .shade{position:absolute;inset:0;background:rgba(14,30,70,.45);animation:fade .2s}
  .drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(86vw,360px);background:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;overflow:auto;animation:slide .22s ease-out}
  .drawer .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .drawer .close{width:44px;height:44px;border:0;border-radius:14px;background:var(--paper);color:var(--navy);cursor:pointer;display:grid;place-items:center}
  .drawer nav a{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:900;font-size:19px;color:var(--ink);padding:12px 10px;border-radius:16px}
  .drawer nav a:hover{background:var(--paper)}
  .drawer nav a i{width:12px;height:12px;border-radius:50%;background:var(--c)}
  .drawer .lang{align-self:flex-start;background:var(--paper);margin:10px 0}
  .drawer .btn{width:100%;margin-top:8px}
  @keyframes slide{from{transform:translateX(100%)}}
  @keyframes fade{from{opacity:0}}

  /* hero */
  .hero{background:linear-gradient(180deg,var(--sky) 0%,#bfe2f8 72%,var(--paper) 100%);position:relative;overflow:hidden}
  .hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center;padding-block:26px 64px;position:relative;z-index:1}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--pink);font-weight:900;font-size:14px;padding:6px 14px;border-radius:999px}
  .hero h1{font-size:clamp(32px,5vw,56px);font-weight:900;color:var(--navy);margin:16px 0 14px}
  .hero h1 em{font-style:normal;color:var(--pink)}
  .lead{font-size:clamp(17px,2vw,20px);margin:0 0 22px;max-width:34em}
  .ctas{display:flex;flex-wrap:wrap;gap:12px}
  .trust{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding:0;list-style:none}
  .trust li{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.75);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px;color:var(--navy)}
  .trust li svg{width:17px;height:17px;color:var(--green)}
  .hero-logo{width:100%;max-width:500px;margin-inline:auto;filter:drop-shadow(0 18px 30px rgba(20,70,140,.18));animation:bob 5s ease-in-out infinite}
  .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;pointer-events:none}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .c1{width:150px;height:44px;left:-30px;bottom:38px}.c1::before{width:70px;height:70px;left:30px;top:-34px}.c1::after{width:52px;height:52px;left:84px;top:-22px}
  .c2{width:120px;height:36px;right:6%;top:30px}.c2::before{width:56px;height:56px;left:20px;top:-28px}.c2::after{width:40px;height:40px;left:64px;top:-16px}
  @media(max-width:820px){.hero h1{font-size:clamp(28px,8vw,36px);margin:12px 0 10px}.lead{font-size:16px;margin-bottom:18px}.trust{margin-top:16px}.trust li{font-size:13px;padding:6px 11px}}
  @media(max-width:820px){.hero .wrap{grid-template-columns:minmax(0,1fr);padding-block:18px 52px;text-align:center}.hero-art{display:none}.ctas,.trust{justify-content:center}.ctas .btn{flex:1 1 220px}}

  /* offer tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:-30px;position:relative;z-index:2}
  .tile{display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:22px;padding:18px;text-decoration:none;box-shadow:0 10px 24px rgba(26,80,140,.1);border-top:6px solid var(--c);transition:transform .15s;min-width:0}
  .tile:hover{transform:translateY(-3px)}
  .tile .ic{width:46px;height:46px;border-radius:15px;background:var(--c);color:#fff;display:grid;place-items:center}
  .tile .ic svg{width:26px;height:26px}
  .tile b{font-size:18px;line-height:1.2}
  .tile small{color:var(--muted);font-weight:700;font-size:14px;line-height:1.35}
  .tile span.go{margin-top:auto;font-weight:900;color:var(--c);font-size:14px}
  @media(max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:420px){.tile{padding:14px}.tile b{font-size:16px}.tile small{display:none}}

  section{padding-block:60px 6px}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .sec-head h2{font-size:clamp(28px,4vw,40px);font-weight:900;color:var(--navy)}
  .sec-head p{margin:8px 0 0;color:var(--muted);font-weight:700;max-width:40em}
  .squiggle{display:block;width:110px;height:14px;margin-top:8px}
  .price{display:inline-flex;align-items:baseline;gap:4px;font-weight:900;color:var(--navy)}
  .price b{font-size:22px}
  .price small{color:var(--muted);font-weight:800;font-size:13px}

  /* garden */
  .garden{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
  .garden-card{background:var(--sun);border-radius:var(--r);padding:28px;position:relative;overflow:hidden;color:var(--navy)}
  .garden-card h3{font-size:clamp(24px,3vw,30px);font-weight:900;max-width:14em}
  .garden-card ul{list-style:none;padding:0;margin:16px 0 22px;display:grid;gap:9px;font-weight:800;position:relative}
  .garden-card li{display:flex;gap:10px;align-items:flex-start}
  .garden-card li svg{width:22px;height:22px;color:var(--pink);margin-top:1px}
  .garden-card .sunimg{position:absolute;right:-30px;top:-20px;width:170px;opacity:.5;animation:spin 40s linear infinite}
  .slots{display:grid;gap:12px;align-content:start}
  .slot{background:#fff;border-radius:var(--r);padding:20px 22px;border:3px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .slot .time{font:900 26px var(--font);color:var(--blue);white-space:nowrap}
  .slot b{display:block}.slot small{color:var(--muted);font-weight:700}
  .slot .price{margin-left:auto}
  .note{background:#fff;border-radius:20px;padding:16px 18px;font-weight:700;color:var(--muted);display:flex;gap:12px;align-items:center}
  .note svg{width:26px;height:26px;color:var(--blue)}
  @media(max-width:820px){.garden{grid-template-columns:minmax(0,1fr)}.garden-card{padding:22px}}

  /* clubs */
  .filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 8px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{flex:none;border:2px solid var(--line);background:#fff;color:var(--ink);font:800 15px var(--font);padding:9px 15px;border-radius:999px;cursor:pointer}
  .filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .clubs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .club{background:#fff;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:9px;min-width:0;box-shadow:0 8px 20px rgba(26,80,140,.08);position:relative;overflow:hidden}
  .club::before{content:"";position:absolute;inset:0 0 auto;height:7px;background:var(--c)}
  .club .hd{display:flex;gap:12px;align-items:center}
  .club .ico{width:50px;height:50px;border-radius:16px;background:var(--c);display:grid;place-items:center;color:#fff}
  .club .ico svg{width:27px;height:27px}
  .club h3{font-size:19px;font-weight:900}
  .club p{margin:0;color:var(--muted);font-weight:700;font-size:15px}
  .when{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:color-mix(in srgb,var(--c) 14%,#fff);font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px}
  .club .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
  .club .ask{font:900 15px var(--font);color:var(--c);text-decoration:none;display:inline-flex;gap:6px;align-items:center;min-height:40px}
  .club .ask:hover{text-decoration:underline}
  .club[hidden]{display:none}
  @media(max-width:980px){.clubs{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:600px){.clubs{grid-template-columns:minmax(0,1fr)}.club{padding:18px}}

  /* specialists */
  .duo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .spec{border-radius:var(--r);padding:24px;color:#fff;display:flex;flex-direction:column;gap:10px;min-width:0}
  .spec h3{font-size:24px;font-weight:900}
  .spec p{margin:0;font-weight:700;opacity:.95}
  .spec .tag{align-self:flex-start;background:rgba(255,255,255,.22);font-weight:900;font-size:13px;padding:5px 12px;border-radius:999px}
  .spec .btn{margin-top:auto;align-self:flex-start;min-height:46px;font-size:15px}
  .spec .price{color:#fff}.spec .price small{color:rgba(255,255,255,.85)}
  /* on yellow, text is dark blue — white on yellow is unreadable */
  .spec.on-sun,.spec.on-sun .price,.spec.on-sun .who.light{color:var(--navy)}.spec.on-sun .price small{color:var(--ink)}.spec.on-sun .tag{background:rgba(255,255,255,.55)}
  .club.on-sun .ico,.tile.on-sun .ic,.days button.on-sun[aria-pressed="true"],.day.on-sun h3,.steps li.on-sun::before{color:var(--navy)}
  @media(max-width:900px){.duo{grid-template-columns:minmax(0,1fr)}}

  /* steps */
  .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:s;list-style:none;padding:0;margin:0}
  .steps li{background:#fff;border-radius:var(--r);padding:22px;position:relative;box-shadow:0 8px 20px rgba(26,80,140,.07)}
  .steps li::before{counter-increment:s;content:counter(s);width:44px;height:44px;border-radius:14px;background:var(--c);color:#fff;font-weight:900;font-size:21px;display:grid;place-items:center;margin-bottom:12px}
  .steps b{display:block;font-size:19px;margin-bottom:4px}
  .steps span{color:var(--muted);font-weight:700}
  @media(max-width:820px){.steps{grid-template-columns:minmax(0,1fr)}.steps li{display:grid;grid-template-columns:44px 1fr;column-gap:14px;padding:18px}.steps li::before{grid-row:span 2;margin:0}}

  /* gallery, team, reviews (shown only when filled) */
  .gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px}
  .gallery img:first-child{grid-column:span 2;grid-row:span 2}
  @media(max-width:700px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .team{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .person{background:#fff;border-radius:22px;padding:14px;text-align:center}
  .person img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;margin-bottom:10px}
  .person b{display:block;line-height:1.25}.person small{color:var(--muted);font-weight:700;font-size:14px;line-height:1.3;display:block;margin-top:4px}
  .exp{display:inline-block;margin-top:6px;background:color-mix(in srgb,var(--c,#1a8fe0) 14%,#fff);color:var(--navy);font-weight:900;font-size:13px;padding:4px 10px;border-radius:999px}
  .ava{width:72px;height:72px;border-radius:24px;background:var(--c);color:#fff;font-weight:900;font-size:32px;display:grid;place-items:center;margin:4px auto 10px}
  .who{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--navy)}
  .who svg{width:16px;height:16px}.who.light{color:#fff}
  @media(max-width:480px){.team{grid-template-columns:repeat(2,minmax(0,1fr))}.person{padding:12px 10px}}
  .reviews{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .review{background:#fff;border-radius:22px;padding:20px;margin:0;box-shadow:0 8px 20px rgba(26,80,140,.07);display:flex;flex-direction:column}
  .review[hidden]{display:none}
  .review figcaption{margin-top:auto}
  .stars{color:#f5b400;letter-spacing:2px;font-size:16px}
  .review .stars{margin-bottom:8px}
  .gbadge{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:800;color:var(--ink)}
  .gbadge b{font-size:28px;color:var(--navy)}.gbadge small{color:var(--muted);font-size:14px}
  .review blockquote{margin:0 0 10px;font-weight:700}
  .review figcaption{color:var(--muted);font-weight:800;font-size:14px}
  @media(max-width:980px){.reviews{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.reviews{grid-template-columns:minmax(0,1fr)}}

  /* schedule */
  .days{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
  .days::-webkit-scrollbar{display:none}
  .days button{flex:1 0 auto;border:0;background:#fff;color:var(--ink);font:900 15px var(--font);padding:10px 14px;border-radius:14px;cursor:pointer;border-bottom:4px solid var(--c)}
  .days button[aria-pressed="true"]{background:var(--c);color:#fff}
  .week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
  .day{background:#fff;border-radius:22px;padding:14px;min-width:0;border:2px solid var(--line)}
  .day h3{font-size:16px;font-weight:900;color:#fff;background:var(--c);border-radius:12px;padding:6px 10px;margin-bottom:10px;text-align:center}
  .day ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
  .day li{font-size:14px;line-height:1.3;font-weight:700}
  .day li b{display:block;color:var(--navy);font-variant-numeric:tabular-nums}
  @media(max-width:1000px){.days{display:flex}.week{grid-template-columns:minmax(0,1fr)}.day{display:none;padding:18px}.day.on{display:block}.day h3{display:none}.day li{font-size:16px;display:flex;gap:14px}.day li b{min-width:110px}}

  /* faq */
  .faq{display:grid;gap:10px}
  .faq details{background:#fff;border-radius:20px;padding:4px 20px;border:2px solid var(--line)}
  .faq details[open]{border-color:var(--blue)}

const stats = (() => {
  const q = []; const on = !!STATS_URL && !navigator.webdriver;

  addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
  addEventListener("pagehide", flush);
  return { push: (t, v, extra) => { if (on) q.push({ t, v, ...(extra || {}) }); }, flush };
})();

let allReviews = false, lang = "ka", cat = "all", day = Math.min(Math.max(new Date().getDay(), 1), 6);
const priceHtml = (p, unit) => SHOW_PRICES && p ? `<span class="price">${T[lang].from ? `<small>${esc(T[lang].from)}</small>` : ""}<b>${p}</b><small>${esc(unit === "l" ? T[lang].perL : unit === "c" ? T[lang].perC : T[lang].perM)}</small></span>` : "";
const teacherLine = (id, light) => { const p = TEAM.find(x => x.id === id); return p ? `<span class="who${light ? " light" : ""}">${ICON.one}${esc(p.name[lang])}</span>` : ""; };
const dayRange = days => days.length === 5 ? `${SHORT[lang][0]}–${SHORT[lang][4]}` : days.map(d => SHORT[lang][d - 1]).join(" · ");

function renderClubs() {
  const t = T[lang];
  $("filters").innerHTML = t.cats.map(([k, l]) => `<button type="button" data-cat="${k}" aria-pressed="${k === cat}">${esc(l)}</button>`).join("");
  $("clubList").innerHTML = CLUBS.map(k => `<article class="club${k.c === C.sun ? " on-sun" : ""}" style="--c:${k.c}" ${cat !== "all" && !k.cat.split(" ").includes(cat) ? "hidden" : ""}><div class="hd"><span class="ico">${ICON[k.icon]}</span><h3>${esc(k.name[lang])}</h3></div><p>${esc(k.text[lang])}</p>${teacherLine(k.teacher)}<div class="when">${k.days.length ? `<span class="chip">${esc(dayRange(k.days))}</span>` : ""}${k.time ? `<span class="chip">${esc(k.time)}</span>` : ""}${k.appt ? `<span class="chip">${esc(t.appt)}</span>` : ""}</div><div class="ft">${priceHtml(k.price, k.unit)}<a class="ask" data-tg data-what="${esc(k.name[lang])}" href="${TG}" target="_blank" rel="noopener">${esc(t.ask)}</a></div></article>`).join("");
}
function renderWeek() {
  const t = T[lang], COLORS = [C.pink, C.green, C.blue, C.red, C.navy, C.sun];
  $("dayTabs").innerHTML = SHORT[lang].map((n, i) => `<button type="button" role="tab" data-day="${i + 1}" class="${COLORS[i] === C.sun ? "on-sun" : ""}" style="--c:${COLORS[i]}" aria-pressed="${day === i + 1}">${esc(n)}</button>`).join("");
  $("week").innerHTML = DAYS[lang].map((name, i) => {
    const d = i + 1, items = [];
    if (d <= 5) items.push(["10:00–16:00", t.gardenShort]);
    [...CLUBS, ...SPECS].filter(k => (k.days || []).includes(d) && !k.appt).forEach(k => items.push([k.time, k.name[lang]]));
    items.sort((a, b) => a[0].localeCompare(b[0]));
    return `<div class="day ${d === day ? "on" : ""} ${COLORS[i] === C.sun ? "on-sun" : ""}" style="--c:${COLORS[i]}"><h3>${esc(name)}</h3><ul>${items.map(([tm, n]) => `<li><b>${esc(tm)}</b><span>${esc(n)}</span></li>`).join("")}</ul></div>`;
  }).join("");
}
function render(next) {
  lang = next; const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (typeof v === "string") el.innerHTML = el.dataset.t === "heroTitle" ? v : esc(v); });
  document.querySelectorAll(".lang").forEach(box => { box.innerHTML = [["ka","ქარ"],["ru","РУС"],["en","ENG"]].map(([k, l]) => `<button type="button" data-lang="${k}" aria-pressed="${k === lang}">${l}</button>`).join(""); });
  $("nav").innerHTML = t.nav.map(([id, l]) => `<a href="#${id}" data-sec="${id}">${esc(l)}</a>`).join("");
  $("drawerNav").innerHTML = t.nav.map(([id, l, c]) => `<a href="#${id}" style="--c:${c}"><i></i>${esc(l)}</a>`).join("");
  $("trust").innerHTML = t.trust.map(x => `<li>${ICON.check}${esc(x)}</li>`).join("");
  $("tiles").innerHTML = t.tiles.map(([to, ic, c, b, s]) => `<a class="tile" href="#${to.split(":")[0]}" ${to.includes(":") ? `data-filter="${to.split(":")[1]}"` : ""} style="--c:${c}"><span class="ic">${ICON[ic]}</span><b>${esc(b)}</b><small>${esc(s)}</small><span class="go">${esc(t.more)}</span></a>`).join("");
  $("gardenList").innerHTML = t.gardenList.map(x => `<li>${ICON.check}<span>${esc(x)}</span></li>`).join("");
  $("slots").innerHTML = GARDEN_SLOTS.map(s => `<div class="slot"><span class="time">${s.time}</span><div><b>${esc(s.label[lang])}</b><small>${esc(dayRange([1,2,3,4,5]))}</small></div>${priceHtml(s.price, "m")}</div>`).join("") + `<div class="note">${ICON.info}<span>${esc(t.gardenNote)}</span></div>`;
  renderClubs();
  $("specList").innerHTML = SPECS.map(s => `<article class="spec${s.c === C.sun ? " on-sun" : ""}" style="background:${s.c}"><span class="tag">${esc(s.mc ? "Telegram" : t.appt)}</span><h3>${esc(s.name[lang])}</h3><p>${esc(s.text[lang])}</p>${teacherLine(s.teacher, true)}${s.days ? `<span class="tag">${esc(dayRange(s.days))} · ${esc(s.time)}</span>` : ""}${priceHtml(s.price, s.unit)}<a class="btn b-white" data-tg data-what="${esc(s.name[lang])}" href="${TG}" target="_blank" rel="noopener">${esc(s.mc ? t.mcBtn : t.specBtn)}</a></article>`).join("");
  $("steps").innerHTML = t.steps.map(([b, s], i) => `<li style="--c:${[C.pink, C.green, C.blue][i]}"><b>${esc(b)}</b><span>${esc(s)}</span></li>`).join("");
  $("photos").hidden = !PHOTOS.length; $("gallery").innerHTML = PHOTOS.map(src => `<img src="${esc(src)}" alt="" loading="lazy">`).join("");
  $("team").hidden = !TEAM.length; $("teamList").innerHTML = TEAM.map(p => `<div class="person" style="--c:${p.c}">${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name[lang])}" loading="lazy">` : `<span class="ava" style="--c:${p.c}">${esc(p.name[lang].slice(0, 1))}</span>`}<b>${esc(p.name[lang])}</b>${p.exp ? `<span class="exp">${esc(T[lang].exp(p.exp))}</span>` : ""}<small>${esc(p.role[lang])}</small></div>`).join("");
  $("reviews").hidden = !REVIEWS.length; $("reviewList").innerHTML = REVIEWS.map((r, i) => `<figure class="review" ${i >= 6 && !allReviews ? "hidden" : ""}><blockquote>“${esc(r.text[lang] || r.text.ru)}”</blockquote><figcaption>${esc(r.who)} · Google</figcaption></figure>`).join("");
  $("moreReviews").parentElement.hidden = allReviews || REVIEWS.length <= 6;
  $("gbadge").innerHTML = `<b>${String(GOOGLE_RATING.stars).replace(".", lang === "en" ? "." : ",")}</b><span class="stars">★★★★★</span><small>${esc(t.gCount(GOOGLE_RATING.count))}</small>`;
  $("gLink").href = GOOGLE_RATING.url;
  renderWeek();
  $("faqList").innerHTML = t.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
  try { localStorage.setItem("gimili_site_lang", lang); } catch (_) {}
}

// language, filters, day tabs, tiles
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if (b) { stats.push("lang", b.dataset.lang); return render(b.dataset.lang); }
  const f = e.target.closest("[data-cat]"); if (f) { cat = f.dataset.cat; stats.push("filter", cat); return renderClubs(); }
  const c = e.target.closest('a[href^="tel:"],a[href*="wa.me/"],a[href*="t.me/"]');
  if (c && !c.hasAttribute("data-tg")) { stats.push("contact", /wa\.me/.test(c.href) ? "whatsapp" : /t\.me/.test(c.href) ? "telegram" : "call"); stats.flush(); }
  const d = e.target.closest("[data-day]"); if (d) { day = +d.dataset.day; return renderWeek(); }
  if (e.target.closest("#moreReviews")) { allReviews = true; document.querySelectorAll("#reviewList .review").forEach(x => x.hidden = false); $("moreReviews").parentElement.hidden = true; return; }
  const tile = e.target.closest("[data-filter]"); if (tile) { cat = tile.dataset.filter; renderClubs(); }
});
// "Book" buttons: choose WhatsApp, Telegram or a call (WhatsApp gets a ready message)
const sheet = $("sheet");
const setSheet = open => { sheet.classList.toggle("open", open); sheet.setAttribute("aria-hidden", String(!open)); if (open) sheet.querySelector(".opt").focus(); };
document.addEventListener("click", e => {
  const a = e.target.closest("[data-tg]"); if (!a) return;
  e.preventDefault(); setMenu(false);
  const what = a.dataset.what || (a.dataset.whatKey ? T[lang][a.dataset.whatKey] : "");
  stats.push("book", a.dataset.what ? CLUBS.concat(SPECS).find(k => k.name[lang] === a.dataset.what)?.name.ka || what : what || "general");
  $("sheetWhat").textContent = what;
  $("optWa").href = "https://wa.me/995557256038?text=" + encodeURIComponent(T[lang].waHello + (what ? ` — ${what}` : "") + ".");
  setSheet(true);
});
sheet.addEventListener("click", e => { if (e.target.closest("[data-sheet-close]") || e.target.closest(".opt")) setSheet(false); });
addEventListener("keydown", e => { if (e.key === "Escape") setSheet(false); });
// mobile menu
const drawer = $("drawer"), burger = document.querySelector(".burger");
const setMenu = open => { drawer.classList.toggle("open", open); drawer.setAttribute("aria-hidden", String(!open)); burger.setAttribute("aria-expanded", String(open)); document.body.style.overflow = open ? "hidden" : ""; if (open) drawer.querySelector(".close").focus(); };
burger.addEventListener("click", () => setMenu(true));
drawer.addEventListener("click", e => { if (e.target.closest("[data-close]") || e.target.closest("nav a")) setMenu(false); });
addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
// header shadow, phone action bar, current section in the menu
const head = $("top"), bar = $("bar");
const onScroll = () => { const y = scrollY; head.classList.toggle("scrolled", y > 4); bar.classList.toggle("show", y > 480); };
addEventListener("scroll", onScroll, { passive: true }); onScroll();
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); } }), { threshold: 0.08 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  const seen = new Set(), sio = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting && !seen.has(en.target.id)) { seen.add(en.target.id); stats.push("section", en.target.id); } }), { rootMargin: "0px 0px -40% 0px" });
  document.querySelectorAll("main section[id]").forEach(s => sio.observe(s));
  const spy = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.sec === en.target.id)); }), { rootMargin: "-45% 0px -50% 0px" });
  document.querySelectorAll("main section[id]").forEach(s => spy.observe(s));
} else document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));

try { const saved = localStorage.getItem("gimili_site_lang"); if (T[saved]) lang = saved; } catch (_) {}
render(lang);
trackVisit();
</script>
</body>
</html>
