<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Layout: sky-blue band with the logo's sun, then white "toy-box" cards in the logo's six colours; one bold colour per card. */
  :root{
    --sky:#8ec8ef; --sky-deep:#4aa7e6; --cloud:#ffffff; --paper:#f4faff;
    --navy:#1b3cae; --ink:#16305a; --muted:#5a7290;
    --sun:#ffd21f; --sun-deep:#f5b400; --pink:#e8178a; --green:#22a83a; --blue:#1a8fe0; --red:#e5261f;
    --line:#dbe9f5;
    --display:"Nunito","Noto Sans Georgian",system-ui,sans-serif;
    --body:"Nunito","Noto Sans Georgian",system-ui,sans-serif;
    --r:28px;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden}
  @supports(overflow:clip){body{overflow-x:clip}}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
  a{color:inherit}
  .wrap{width:min(100%,1120px);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
  :focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:10px}

  /* header */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(142,200,239,.92);backdrop-filter:blur(10px)}
  .top .wrap{display:flex;align-items:center;gap:10px;padding-block:3px}
  .top img{height:40px;width:auto;display:block}
  .tel-top{display:inline-flex;align-items:center;gap:6px;background:var(--pink);color:#fff;text-decoration:none;font:900 14px var(--body);padding:7px 12px;border-radius:999px;white-space:nowrap;flex:none}
  .tel-top svg{width:15px;height:15px}
  .nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  .nav a{text-decoration:none;font-weight:800;color:var(--navy);padding:8px 12px;border-radius:999px;font-size:15px}
  .nav a:hover{background:rgba(255,255,255,.6)}
  .lang{display:flex;background:#fff;border-radius:999px;padding:3px;gap:2px;flex:none}
  .lang button{border:0;background:transparent;font:800 13px var(--body);color:var(--navy);padding:6px 10px;border-radius:999px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
  @media(max-width:820px){.nav{display:none}.tel-top{margin-left:auto}}
  @media(max-width:420px){.top img{height:34px}.tel-top{font-size:13px;padding:6px 10px}.lang button{padding:5px 7px;font-size:12px}}

  /* hero */
  .hero{background:linear-gradient(180deg,var(--sky) 0%,#bfe2f8 70%,var(--paper) 100%);position:relative;overflow:hidden}
  .hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:center;padding-block:24px 70px}
  .hero-logo{width:100%;max-width:520px;height:auto;filter:drop-shadow(0 18px 30px rgba(20,70,140,.18));animation:bob 5s ease-in-out infinite}
  .eyebrow{display:inline-block;background:#fff;color:var(--pink);font-weight:900;font-size:14px;letter-spacing:.04em;padding:6px 14px;border-radius:999px}
  .hero h1{font-size:clamp(32px,5.2vw,58px);font-weight:900;color:var(--navy);margin:16px 0 14px}
  .hero h1 em{font-style:normal;color:var(--pink)}
  .hero p.lead{font-size:clamp(17px,2vw,20px);color:var(--ink);max-width:34em;margin:0 0 24px}
  .ctas{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:999px;font:900 17px var(--body);text-decoration:none;cursor:pointer;border:0;transition:transform .15s ease,box-shadow .15s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn-sun{background:var(--sun);color:var(--navy);box-shadow:0 6px 0 var(--sun-deep)}
  .btn-pink{background:var(--pink);color:#fff;box-shadow:0 6px 0 #b80f6b}
  .btn-white{background:#fff;color:var(--navy);box-shadow:0 6px 0 var(--line)}
  .btn svg{width:22px;height:22px;flex:none}
  .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;z-index:0;pointer-events:none}
  .hero .wrap{position:relative;z-index:1}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .c1{width:150px;height:44px;left:-30px;bottom:38px}.c1::before{width:70px;height:70px;left:30px;top:-34px}.c1::after{width:52px;height:52px;left:84px;top:-22px}
  .c2{width:120px;height:36px;right:6%;top:30px}.c2::before{width:56px;height:56px;left:20px;top:-28px}.c2::after{width:40px;height:40px;left:64px;top:-16px}
  @media(max-width:820px){.hero .wrap{grid-template-columns:minmax(0,1fr);padding-block:10px 56px;text-align:center}.hero-art{order:-1}.hero-logo{max-width:340px;margin:0 auto;display:block}.ctas{justify-content:center}.hero p.lead{margin-inline:auto}}

  /* quick facts */
  .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:-34px;position:relative;z-index:2}
  .fact{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 10px 24px rgba(26,80,140,.1);display:flex;gap:12px;align-items:center;min-width:0}
  .fact i{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:900;font-size:20px}
  .fact>div{min-width:0}.fact b{display:block;font-size:16px;line-height:1.2}
  @media(max-width:560px){.fact{flex-direction:column;align-items:flex-start;gap:8px;padding:14px}.fact b{font-size:15px}.garden-card .sunimg{width:120px;opacity:.35}}.fact small{color:var(--muted);font-weight:700;font-size:13px}
  @media(max-width:820px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}

  section{padding-block:56px 8px}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .sec-head h2{font-size:clamp(28px,4vw,42px);font-weight:900;color:var(--navy)}
  .sec-head p{margin:6px 0 0;color:var(--muted);font-weight:700;max-width:38em}
  .squiggle{display:block;width:120px;height:14px;margin-top:8px}

  /* garden */
  .garden{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
  .garden-card{background:var(--sun);border-radius:var(--r);padding:28px;position:relative;overflow:hidden;color:var(--navy)}
  .garden-card h3{font-size:30px;font-weight:900}
  .garden-card ul{list-style:none;padding:0;margin:16px 0 22px;display:grid;gap:8px;font-weight:800}
  .garden-card li{display:flex;gap:10px;align-items:flex-start}
  .garden-card li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--pink);margin-top:7px;flex:none}
  .garden-card .sunimg{position:absolute;right:-30px;top:-20px;width:170px;opacity:.55;animation:spin 40s linear infinite}
  .slots{display:grid;gap:12px}
  .slot{background:#fff;border-radius:var(--r);padding:22px;border:3px solid var(--line);display:flex;gap:16px;align-items:center}
  .slot .time{font:900 26px var(--display);color:var(--blue);white-space:nowrap}
  .slot b{display:block}.slot small{color:var(--muted);font-weight:700}
  @media(max-width:820px){.garden{grid-template-columns:minmax(0,1fr)}}

  /* clubs */
  .clubs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .club{background:#fff;border-radius:var(--r);padding:22px 20px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 8px 20px rgba(26,80,140,.08);position:relative;overflow:hidden}
  .club::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:var(--c)}
  .club .ico{width:56px;height:56px;border-radius:18px;background:var(--c);display:grid;place-items:center;color:#fff}
  .club .ico svg{width:30px;height:30px}
  .club h3{font-size:21px;font-weight:900;color:var(--ink)}
  .club p{margin:0;color:var(--muted);font-weight:700;font-size:15px}
  .when{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
  .chip{background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--ink);font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px}
  .club .ask{margin-top:6px;align-self:flex-start;font:900 15px var(--body);color:var(--c);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
  .club .ask:hover{text-decoration:underline}
  @media(max-width:980px){.clubs{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:600px){.clubs{grid-template-columns:minmax(0,1fr)}}

  /* specialists + master classes */
  .duo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .spec{border-radius:var(--r);padding:24px;color:#fff;display:flex;flex-direction:column;gap:10px;min-width:0}
  .spec h3{font-size:24px;font-weight:900}
  .spec p{margin:0;font-weight:700;opacity:.95}
  .spec .tag{align-self:flex-start;background:rgba(255,255,255,.22);font-weight:900;font-size:13px;padding:5px 12px;border-radius:999px}
  .spec .btn{margin-top:auto;align-self:flex-start;min-height:46px;font-size:15px}
  @media(max-width:900px){.duo{grid-template-columns:minmax(0,1fr)}}

  /* schedule */
  .week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
  .day{background:#fff;border-radius:22px;padding:14px;min-width:0;border:2px solid var(--line)}
  .day h3{font-size:16px;font-weight:900;color:#fff;background:var(--c);border-radius:12px;padding:6px 10px;margin-bottom:10px;text-align:center}
  .day ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .day li{font-size:14px;line-height:1.3;font-weight:700}
  .day li b{display:block;color:var(--navy);font-variant-numeric:tabular-nums}
  @media(max-width:1000px){.week{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:600px){.week{grid-template-columns:minmax(0,1fr)}}

  /* contact */
  .contact{background:var(--navy);color:#fff;border-radius:36px;padding:36px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;position:relative;overflow:hidden;margin-bottom:28px}
  .contact h2{font-size:clamp(28px,4vw,40px);font-weight:900}
  .contact p{margin:10px 0 0;font-weight:700;opacity:.9}
  .contact .rows{display:grid;gap:12px}
  .crow{background:rgba(255,255,255,.1);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
  .crow small{display:block;opacity:.75;font-weight:700;font-size:13px}
  .crow>div{min-width:0;flex:1 1 180px}.crow b{font-size:19px;user-select:all;overflow-wrap:anywhere}
  .crow b a{all:unset;cursor:pointer;color:#fff}
  .crow>a,.crow>button{color:var(--navy);background:var(--sun);border:0;border-radius:999px;padding:8px 14px;font:900 14px var(--body);text-decoration:none;cursor:pointer}
  .contact .sunimg{position:absolute;right:-40px;bottom:-60px;width:220px;opacity:.25;animation:spin 50s linear infinite}
  @media(max-width:820px){.contact{grid-template-columns:minmax(0,1fr);padding:26px 20px}}
  footer{padding-block:10px 40px;color:var(--muted);font-weight:700;font-size:14px;text-align:center}
  .social{display:flex;justify-content:center;gap:12px;margin-bottom:12px}.social a{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;text-decoration:none}.social a:nth-child(1){background:var(--pink)}.social a:nth-child(2){background:var(--blue)}.social a:nth-child(3){background:var(--navy)}.social svg{width:24px;height:24px}

  @keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}</style>
</head>
<body>

  <div class="wrap">

    const items = [];
    if (d <= 5) items.push([ "10:00–16:00", t.gardenShort ]);
    CLUBS.filter(k => k.days.includes(d) && !k.appt).forEach(k => items.push([k.time, k.name[lang]]));
    items.sort((a, b) => a[0].localeCompare(b[0]));
    return `<div class="day" style="--c:${DAY_COLORS[i]}"><h3>${esc(name)}</h3><ul>${items.map(([tm, n]) => `<li><b>${esc(tm)}</b>${esc(n)}</li>`).join("")}</ul></div>`;
  }).join("");
  try { localStorage.setItem("gimili_site_lang", lang); } catch (_) {}
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => render(b.dataset.lang)));
let start = "ka";
try { const saved = localStorage.getItem("gimili_site_lang"); if (T[saved]) start = saved; } catch (_) {}
render(start);
</script>
